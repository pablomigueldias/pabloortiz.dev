name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Termos pessoais que nunca podem ser publicados (uma linha por termo).
      # O linter de privacidade nunca imprime o termo: este log é público.
      PRIVACIDADE_DENYLIST: ${{ secrets.PRIVACIDADE_DENYLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico inteiro para o gitleaks
          persist-credentials: false

      # Primeiro o gitleaks: se houver segredo, nem instala dependência.
      - name: gitleaks (histórico inteiro)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verificar:imagens
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Com rascunhos: o CI testa a renderização de todo post, inclusive os drafts.
      - run: npm run build
        env:
          INCLUIR_RASCUNHOS: "1"
      # Empacota o Worker a partir do build acima e mede: o plano grátis da
      # Cloudflare aceita até 3 MiB comprimido.
      - run: npx opennextjs-cloudflare build --skipNextBuild
      - run: npm run verificar:worker
